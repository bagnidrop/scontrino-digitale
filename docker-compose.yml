services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      BEHIND_PROXY: "1"
      COOKIE_SECURE: "1"
      PUBLIC_BASE_URL: "https://${DOMAIN}"
    volumes:
      - app-data:/app/instance
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  caddy-data:
  caddy-config:
