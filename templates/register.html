{% extends "base.html" %}
{% block title %}Registrati · Scontrino Digitale{% endblock %}
{% block mainclass %}container narrow{% endblock %}
{% block content %}
<h1>Crea il tuo account</h1>
<form method="post" class="card form">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <label>Nome del locale <input name="name" required maxlength="80" autofocus></label>
  <label>Email <input type="email" name="email" required autocomplete="username"></label>
  <label>Password (almeno 8 caratteri) <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
  <button class="btn" type="submit">Crea account</button>
</form>
<p class="muted center">Hai già un account? <a href="{{ url_for('login') }}">Accedi</a></p>
{% endblock %}
